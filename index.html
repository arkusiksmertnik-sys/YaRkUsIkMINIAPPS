<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YaRkUsIk Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="app-container">
        <!-- Шапка Профиля -->
        <header class="glass-header">
            <div class="profile-info">
                <div class="avatar-glow">
                    <img id="user-avatar" src="https://via.placeholder.com/100" alt="Avatar">
                </div>
                <div>
                    <div class="title-with-badge">
                        <h1 id="user-name">YaRkUsIk</h1>
                        <span class="blue-badge" title="Подтвержденный профиль">✓</span>
                    </div>
                    <span class="badge" id="role-badge">Official Artist</span>
                </div>
            </div>
            <button id="admin-badge" class="admin-btn-trigger" style="display: none;" onclick="openAdminModal()">
                ⚡ Админка
            </button>
        </header>

        <!-- Поисковая строка -->
        <div class="search-box glass-card">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Поиск по релизом и новостям..." oninput="handleSearch()">
        </div>

        <!-- ОСНОВНОЙ КОНТЕНТ (РАЗДЕЛЫ) -->

        <!-- 1. Вкладка: Главная / Треки -->
        <main id="tab-tracks" class="tab-content active">
            <h2 class="section-title">🎵 Релизы & Сниппеты</h2>
            <div id="tracks-list" class="cards-grid">
                <div class="loading-spinner">Загрузка музыки...</div>
            </div>
        </main>

        <!-- 2. Вкладка: Новости -->
        <main id="tab-news" class="tab-content">
            <h2 class="section-title">📰 Новости & Лента</h2>
            <div id="news-list" class="news-grid">
                <div class="loading-spinner">Загрузка новостей...</div>
            </div>
        </main>

        <!-- 3. Вкладка: Предстоящее (Upcoming) -->
        <main id="tab-upcoming" class="tab-content">
            <h2 class="section-title">🔥 Анонсы & Сниппеты</h2>
            <div id="upcoming-list" class="cards-grid">
                <div class="loading-spinner">Загрузка анонсов...</div>
            </div>
        </main>

        <!-- 4. Вкладка: Информация / Профиль -->
        <main id="tab-info" class="tab-content">
            <div class="glass-card info-card">
                <h2>👤 О художнике</h2>
                <div class="artist-hero">
                    <h3>YaRkUsIk <span class="blue-badge">✓</span></h3>
                    <p>Официальная карточка музыканта в Telegram Mini App.</p>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-num" id="total-tracks-count">0</span>
                        <span class="stat-label">Релизов</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-num" id="total-news-count">0</span>
                        <span class="stat-label">Новостей</span>
                    </div>
                </div>

                <div class="info-links">
                    <a href="https://t.me/yarkusik" target="_blank" class="glass-link-btn">💬 Telegram Канал</a>
                </div>
            </div>
        </main>
    </div>

    <!-- НИЖНЯЯ СТЕКЛЯННАЯ DOCK-ПАНЕЛЬ (iOS Navigation Dock) -->
    <div class="dock-container">
        <nav class="glass-dock">
            <button class="dock-btn active" onclick="switchTab('tracks')">
                <span class="dock-icon">🎵</span>
                <span class="dock-label">Треки</span>
            </button>
            <button class="dock-btn" onclick="switchTab('news')">
                <span class="dock-icon">📰</span>
                <span class="dock-label">Новости</span>
            </button>
            <button class="dock-btn" onclick="switchTab('upcoming')">
                <span class="dock-icon">🔥</span>
                <span class="dock-label">Анонсы</span>
            </button>
            <button class="dock-btn" onclick="switchTab('info')">
                <span class="dock-icon">👤</span>
                <span class="dock-label">Инфо</span>
            </button>
        </nav>
    </div>

    <!-- Модальное Окно Админки -->
    <div id="admin-modal" class="glass-modal">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h2>Панель администрирования</h2>
                <button class="close-btn" onclick="closeAdminModal()">✕</button>
            </div>
            
            <div class="admin-tabs">
                <button class="admin-tab-btn active" onclick="switchAdminTab('add-track')">+ Трек</button>
                <button class="admin-tab-btn" onclick="switchAdminTab('add-news')">+ Новость</button>
            </div>

            <!-- Форма Трека -->
            <form id="form-track" class="admin-form active" onsubmit="handleTrackSubmit(event)">
                <input type="text" id="track-title" placeholder="Название трека" required>
                <input type="url" id="track-cover" placeholder="Ссылка на обложку (URL)" required>
                <input type="url" id="track-audio" placeholder="Прямая ссылка на MP3/Аудио">
                <input type="url" id="track-link" placeholder="Ссылка на карточку/стриминг">
                <input type="text" id="track-date" placeholder="Дата релиза (напр: 25.10.2026)">
                <label class="checkbox-label">
                    <input type="checkbox" id="track-upcoming"> Пометить как Анонс / Сниппет
                </label>
                <button type="submit" class="apple-btn">Опубликовать от YaRkUsIk ☑️</button>
            </form>

            <!-- Форма Новостей -->
            <form id="form-news" class="admin-form" onsubmit="handleNewsSubmit(event)">
                <textarea id="news-text" placeholder="Текст новости..." rows="4" required></textarea>
                <input type="url" id="news-image" placeholder="Ссылка на картинку (URL)">
                <button type="submit" class="apple-btn">Опубликовать от YaRkUsIk ☑️</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
