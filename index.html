<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YaRkUsIk Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="app-container">
        <!-- Шапка -->
        <header class="glass-header">
            <div class="profile-info">
                <div class="avatar-glow">
                    <img id="user-avatar" src="https://via.placeholder.com/100" alt="Avatar">
                </div>
                <div>
                    <div class="title-with-badge">
                        <h1 id="user-name">YaRkUsIk</h1>
                        <span class="blue-badge" title="Подтвержденный профиль">✓</span>
                    </div>
                    <span class="badge" id="role-badge">Official Artist</span>
                </div>
            </div>
            <button id="admin-badge" class="admin-btn-trigger" style="display: none;" onclick="openAdminModal()">
                ⚡ Админка
            </button>
        </header>

        <!-- Поиск -->
        <div class="search-box glass-card">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Поиск треков и релизов..." oninput="handleSearch()">
        </div>

        <!-- Переключатель Вкладок -->
        <nav class="glass-tabs">
            <button class="tab-btn active" onclick="switchTab('tracks')">🎵 Треки</button>
            <button class="tab-btn" onclick="switchTab('news')">📰 Новости</button>
            <button class="tab-btn" onclick="switchTab('stats')">📊 Инфо</button>
        </nav>

        <!-- Вкладка: Треки -->
        <main id="tab-tracks" class="tab-content active">
            <div id="tracks-list" class="cards-grid">
                <div class="loading-spinner">Загрузка музыкального мира...</div>
            </div>
        </main>

        <!-- Вкладка: Новости -->
        <main id="tab-news" class="tab-content">
            <div id="news-list" class="news-grid">
                <div class="loading-spinner">Загрузка свежих новостей...</div>
            </div>
        </main>

        <!-- Вкладка: Статистика -->
        <main id="tab-stats" class="tab-content">
            <div class="glass-card stats-card">
                <h2>📈 Аналитика карточки</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-num" id="total-tracks-count">0</span>
                        <span class="stat-label">Всего релизов</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-num" id="total-news-count">0</span>
                        <span class="stat-label">Новостей</span>
                    </div>
                </div>
                <div class="author-block">
                    <p>Официальное приложение исполнителя <strong>YaRkUsIk</strong> <span class="blue-badge">✓</span></p>
                </div>
            </div>
        </main>
    </div>

    <!-- Модальное Окно Админ-Панели -->
    <div id="admin-modal" class="glass-modal">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h2>Управление контентом</h2>
                <button class="close-btn" onclick="closeAdminModal()">✕</button>
            </div>
            
            <div class="admin-tabs">
                <button class="admin-tab-btn active" onclick="switchAdminTab('add-track')">+ Трек</button>
                <button class="admin-tab-btn" onclick="switchAdminTab('add-news')">+ Новость</button>
            </div>

            <!-- Форма Трека -->
            <form id="form-track" class="admin-form active" onsubmit="handleTrackSubmit(event)">
                <input type="text" id="track-title" placeholder="Название трека" required>
                <input type="url" id="track-cover" placeholder="Ссылка на обложку (URL)" required>
                <input type="url" id="track-audio" placeholder="Прямая ссылка на MP3/Аудио (необязательно)">
                <input type="url" id="track-link" placeholder="Ссылка на Я.Музыку / VK / Стриминг">
                <input type="text" id="track-date" placeholder="Дата релиза (например: 25.10.2026)">
                <label class="checkbox-label">
                    <input type="checkbox" id="track-upcoming"> Это эксклюзивный сниппет
                </label>
                <button type="submit" class="apple-btn">Опубликовать трек от YaRkUsIk ☑️</button>
            </form>

            <!-- Форма Новостей -->
            <form id="form-news" class="admin-form" onsubmit="handleNewsSubmit(event)">
                <textarea id="news-text" placeholder="Текст новости..." rows="4" required></textarea>
                <input type="url" id="news-image" placeholder="Ссылка на картинку (URL)">
                <button type="submit" class="apple-btn">Опубликовать новость от YaRkUsIk ☑️</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
